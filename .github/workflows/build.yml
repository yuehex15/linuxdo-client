name: 构建 Linux.Do Windows 客户端

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }
      - run: rustc --version && cargo --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri*
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: tauri-cli-${{ runner.os }}-2

      - name: 安装 Tauri CLI
        shell: bash
        run: |
          if ! command -v cargo-tauri &> /dev/null; then
            cargo install tauri-cli --version "^2"
          else
            echo "Tauri CLI 已缓存，跳过编译"
          fi

      - name: 构建 Linux.Do 客户端
        run: cargo tauri build

      - name: 打包 zip
        shell: bash
        run: |
          mkdir -p release/LinuxDo
          cp src-tauri/target/release/*.exe release/LinuxDo/
          cp settings.ini release/LinuxDo/
          powershell -Command "Compress-Archive -Path 'release/LinuxDo/*' -DestinationPath 'release/LinuxDo-Windows-x64.zip' -Force"

      - name: 创建 Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ github.run_number }}
          name: "Linux.Do v${{ github.run_number }}"
          body: |
            Linux.Do 轻量 Windows 客户端自动构建
            
            使用方法：
            1. 下载 LinuxDo-Windows-x64.zip
            2. 解压到任意目录
            3. 运行 LinuxDo.exe
            4. 如需修改域名/代理，编辑 settings.ini 后重启
          artifacts: release/LinuxDo-Windows-x64.zip
          artifactContentType: application/zip
          draft: false
          prerelease: false