name: 构建 Linux.Do Windows 客户端

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }
      - run: rustc --version && cargo --version

      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri* ~/.cargo/.crates.toml ~/.cargo/.crates2.json
          key: tauri-cli-${{ runner.os }}-2

      - name: 安装 Tauri CLI
        shell: bash
        run: |
          if ! command -v cargo-tauri &> /dev/null; then
            cargo install tauri-cli --version "^2"
          else
            echo "Tauri CLI 已缓存，跳过编译"
          fi

      - run: cargo tauri build --bundles msi

      - uses: actions/upload-artifact@v4
        with:
          name: LinuxDo-Windows-x64
          path: src-tauri/target/release/bundle/msi/*.msi
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: LinuxDo-Windows-x64-exe
          path: src-tauri/target/release/*.exe
          compression-level: 0